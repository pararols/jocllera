[build]
  publish = "dist"
  command = "npm run build"

# Memòria cau immutable per als fitxers amb hash generats per Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Evita que el navegador mantingui un index.html antic en memòria cau
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache per als fitxers multimèdia i cinemàtics estàtics
[[headers]]
  for = "/cinematics/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Regla de redirecció per a aplicacions d'una sola pàgina (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
